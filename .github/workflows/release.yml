# Publica una versión: al subir una etiqueta v* (por ejemplo v0.8.1) se compila en Windows y Linux y
# se adjuntan los instaladores, los latest*.yml y los .blockmap a una «release» de GitHub; de ahí los
# lee la actualización automática de la aplicación (src/main/updater.ts).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Empaquetar y publicar
        run: npx electron-builder ${{ runner.os == 'Windows' && '--win' || '--linux' }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # electron-builder crea la release como borrador con el nombre de la etiqueta como texto;
  # aquí se sustituye por la sección de esa versión del CHANGELOG.
  notes:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notas de la versión desde CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=20" --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -n1)
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F body=@notes.md
