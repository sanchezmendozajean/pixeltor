appId: com.pixeltor.app
productName: Pixeltor
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/licenses
    to: licenses
# Las versiones se publican como «releases» de GitHub; electron-updater lee latest*.yml de ahí.
publish:
  provider: github
  owner: sanchezmendozajean
  repo: pixeltor
asar: true
fileAssociations:
  - ext: pixeltor
    name: Documento de Pixeltor
    description: Documento de Pixeltor
    role: Editor
win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  category: Graphics
  artifactName: ${productName}-${version}.${ext}
